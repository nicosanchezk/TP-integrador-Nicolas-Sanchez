<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vivero raiz - Ingreso</title>
</head>
<body>

  <header>
    <h1>Vivero raiz</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catalogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html">Ingresar</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Ingresar</h2>
      <p>Inicia sesión con tu correo para ver tus pedidos.</p>

      <aside role="alert">
        <p><strong>Error:</strong> El correo o la contraseña no coinciden. intente de nuevo.</p>
      </aside>

      <form action="#" method="POST">
        <div>
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        </div>

        <div>
          <label for="clave">Contraseña:</label>
          <input type="password" id="clave" name="clave" required>
        </div>

        <div>
          <input type="checkbox" id="recordar" name="recordar">
          <label for="recordar">Mantener la sesión abierta</label>
        </div>

        <div>
          <button type="submit">Ingresar</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>Vivero Raíz - Todo lo que crece, ordenado.</p>
    <p>Santa Fe, Argentina</p>
  </footer>

</body>
</html>
