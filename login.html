<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vivero Raiz - Ingreso</title>
</head>
<body>

  <header>
    <h1>Vivero Raiz</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html">Ingresar</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Acceso al sistema</h2>
      <p>Ingresá tus credenciales para administrar tus pedidos o consultar tu cuenta.</p>

      <aside role="alert">
        <p><strong>Error:</strong> El usuario o la contraseña son incorrectos.</p>
      </aside>

      <form action="#" method="POST">
        <div>
          <label for="usuario">Correo electrónico:</label>
          <input type="email" id="usuario" name="usuario" required>
        </div>

        <div>
          <label for="clave">Contraseña:</label>
          <input type="password" id="clave" name="clave" required>
        </div>

        <div>
          <input type="checkbox" id="recordar" name="recordar">
          <label for="recordar">Mantener la sesión abierta</label>
        </div>

        <div>
          <button type="submit">Iniciar sesión</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>Vivero Raiz - Santa Fe, Argentina</p>
    <p>Atención al público de lunes a viernes de 8 a 18 hs</p>
  </footer>

</body>
</html>
